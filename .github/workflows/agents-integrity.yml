name: AGENTS Integrity

on:
  pull_request:
    paths:
      - AGENTS.md
      - tools/verify-agents-integrity.mjs
      - package.json
      - .github/workflows/agents-integrity.yml
  push:
    branches:
      - main
      - master
    paths:
      - AGENTS.md
      - tools/verify-agents-integrity.mjs
      - package.json
      - .github/workflows/agents-integrity.yml

jobs:
  verify-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Verify AGENTS integrity
        run: bun run verify:agents
