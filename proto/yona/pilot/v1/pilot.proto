syntax = "proto3";

package yona.pilot.v1;

option go_package = "yona.local/yona/internal/gen/yona/pilot/v1;pilotv1";

service PilotService {
  rpc ReadCurrentSession(ReadCurrentSessionRequest) returns (ReadCurrentSessionResponse) {}
  rpc ReadAuthUiCapabilities(ReadAuthUiCapabilitiesRequest) returns (ReadAuthUiCapabilitiesResponse) {}
  rpc SignInWithPassword(SignInWithPasswordRequest) returns (ReadCurrentSessionResponse) {}
  rpc RegisterWithPassword(RegisterWithPasswordRequest) returns (ReadCurrentSessionResponse) {}
  rpc VerifyUser(VerifyUserRequest) returns (VerifyUserResponse) {}
  rpc SignOut(SignOutRequest) returns (ReadCurrentSessionResponse) {}
  rpc ReadWorkspaceOverview(ReadWorkspaceOverviewRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc SetDefaultLandingPath(SetDefaultLandingPathRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc UpdateProfile(UpdateProfileRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc ChangePassword(ChangePasswordRequest) returns (ReadCurrentSessionResponse) {}
  rpc ResetVisitedProjects(ResetVisitedProjectsRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc AddWorkspaceEmail(AddWorkspaceEmailRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc DeleteWorkspaceEmail(DeleteWorkspaceEmailRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc SendWorkspaceEmailValidation(SendWorkspaceEmailValidationRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc SetMainWorkspaceEmail(SetMainWorkspaceEmailRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc ResetApiToken(ResetApiTokenRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc ToggleWorkspaceNotification(ToggleWorkspaceNotificationRequest) returns (ReadWorkspaceOverviewResponse) {}
  rpc CreateOrganization(CreateOrganizationRequest) returns (OrganizationDetail) {}
  rpc ReadOrganizationDetail(ReadOrganizationDetailRequest) returns (OrganizationDetail) {}
  rpc ReadOrganizationSettings(ReadOrganizationSettingsRequest) returns (OrganizationDetail) {}
  rpc ReadOrganizationMembers(ReadOrganizationMembersRequest) returns (ReadOrganizationMembersResponse) {}
  rpc ReadOrganizationAdmin(ReadOrganizationAdminRequest) returns (OrganizationAdminView) {}
  rpc ReadOrganizationContainer(ReadOrganizationContainerRequest) returns (OrganizationContainer) {}
  rpc UpdateOrganization(UpdateOrganizationRequest) returns (OrganizationDetail) {}
  rpc AddOrganizationMember(AddOrganizationMemberRequest) returns (OrganizationAdminView) {}
  rpc UpdateOrganizationMemberRole(UpdateOrganizationMemberRoleRequest) returns (OrganizationAdminView) {}
  rpc DeleteOrganizationMember(DeleteOrganizationMemberRequest) returns (OrganizationAdminView) {}
  rpc AcceptOrganizationEnrollment(AcceptOrganizationEnrollmentRequest) returns (OrganizationAdminView) {}
  rpc EnrollOrganization(EnrollOrganizationRequest) returns (OrganizationContainer) {}
  rpc CancelEnrollOrganization(CancelEnrollOrganizationRequest) returns (OrganizationContainer) {}
  rpc LeaveOrganization(LeaveOrganizationRequest) returns (OrganizationRedirectResult) {}
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (OrganizationRedirectResult) {}
  rpc CreateProject(CreateProjectRequest) returns (ProjectDetail) {}
  rpc ReadProjectDetail(ReadProjectDetailRequest) returns (ProjectDetail) {}
  rpc ReadProjectSettings(ReadProjectSettingsRequest) returns (ProjectDetail) {}
  rpc ReadProjectMembers(ReadProjectMembersRequest) returns (ReadProjectMembersResponse) {}
  rpc ReadProjectContainer(ReadProjectContainerRequest) returns (ProjectContainer) {}
  rpc UpdateProjectOverview(UpdateProjectOverviewRequest) returns (ProjectContainer) {}
  rpc ToggleProjectWatch(ToggleProjectWatchRequest) returns (ProjectContainer) {}
  rpc UpdateProject(UpdateProjectRequest) returns (ProjectDetail) {}
  rpc EnrollProject(EnrollProjectRequest) returns (EnrollmentMutationResult) {}
  rpc CancelEnrollProject(CancelEnrollProjectRequest) returns (EnrollmentMutationResult) {}
  rpc ToggleFavoriteProject(ToggleFavoriteProjectRequest) returns (ToggleFavoriteProjectResponse) {}
  rpc RecordRecentProjectVisit(RecordRecentProjectVisitRequest) returns (RecordRecentProjectVisitResponse) {}
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {}
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {}
  rpc ListProjectIssues(ListProjectIssuesRequest) returns (ListProjectIssuesResponse) {}
  rpc ReadIssueDetail(ReadIssueDetailRequest) returns (ReadIssueDetailResponse) {}
  rpc UpdateIssueState(UpdateIssueStateRequest) returns (ReadIssueDetailResponse) {}
  rpc CreateIssue(CreateIssueRequest) returns (ReadIssueDetailResponse) {}
  rpc UpdateIssue(UpdateIssueRequest) returns (ReadIssueDetailResponse) {}
  rpc DeleteIssue(DeleteIssueRequest) returns (DeleteIssueResponse) {}
  rpc CreateIssueComment(CreateIssueCommentRequest) returns (ReadIssueDetailResponse) {}
  rpc UpdateIssueComment(UpdateIssueCommentRequest) returns (ReadIssueDetailResponse) {}
  rpc DeleteIssueComment(DeleteIssueCommentRequest) returns (ReadIssueDetailResponse) {}
  rpc ListIssueTimeline(ListIssueTimelineRequest) returns (ListIssueTimelineResponse) {}
  rpc WatchIssue(IssueParticipationRequest) returns (ReadIssueDetailResponse) {}
  rpc UnwatchIssue(IssueParticipationRequest) returns (ReadIssueDetailResponse) {}
  rpc VoteIssue(IssueParticipationRequest) returns (ReadIssueDetailResponse) {}
  rpc UnvoteIssue(IssueParticipationRequest) returns (ReadIssueDetailResponse) {}
  rpc AssignIssue(AssignIssueRequest) returns (ReadIssueDetailResponse) {}
  rpc UnassignIssue(IssueParticipationRequest) returns (ReadIssueDetailResponse) {}
  rpc ShareIssue(IssueShareRequest) returns (ReadIssueDetailResponse) {}
  rpc UnshareIssue(IssueShareRequest) returns (ReadIssueDetailResponse) {}
  rpc MassUpdateIssues(MassUpdateIssuesRequest) returns (MassUpdateIssuesResponse) {}
  rpc ListProjectLabels(ListProjectLabelsRequest) returns (ListProjectLabelsResponse) {}
  rpc ListProjectLabelCategories(ListProjectLabelsRequest) returns (ListProjectLabelCategoriesResponse) {}
  rpc CreateProjectLabel(CreateProjectLabelRequest) returns (ProjectLabelMutationResponse) {}
  rpc UpdateProjectLabel(UpdateProjectLabelRequest) returns (ProjectLabelMutationResponse) {}
  rpc DeleteProjectLabel(DeleteProjectLabelRequest) returns (ProjectLabelDeleteResponse) {}
  rpc CreateProjectLabelCategory(CreateProjectLabelCategoryRequest) returns (ProjectLabelCategoryMutationResponse) {}
  rpc UpdateProjectLabelCategory(UpdateProjectLabelCategoryRequest) returns (ProjectLabelCategoryMutationResponse) {}
  rpc DeleteProjectLabelCategory(DeleteProjectLabelCategoryRequest) returns (ProjectLabelDeleteResponse) {}
  rpc ListProjectMilestones(ListProjectMilestonesRequest) returns (ListProjectMilestonesResponse) {}
  rpc ReadProjectMilestone(ReadProjectMilestoneRequest) returns (ProjectMilestoneMutationResponse) {}
  rpc CreateProjectMilestone(CreateProjectMilestoneRequest) returns (ProjectMilestoneMutationResponse) {}
  rpc UpdateProjectMilestone(UpdateProjectMilestoneRequest) returns (ProjectMilestoneMutationResponse) {}
  rpc DeleteProjectMilestone(DeleteProjectMilestoneRequest) returns (ProjectMilestoneDeleteResponse) {}
  rpc OpenProjectMilestone(MilestoneStateMutationRequest) returns (ProjectMilestoneMutationResponse) {}
  rpc CloseProjectMilestone(MilestoneStateMutationRequest) returns (ProjectMilestoneMutationResponse) {}
  rpc RenderMarkdown(RenderMarkdownRequest) returns (RenderMarkdownResponse) {}
}

