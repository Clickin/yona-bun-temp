[package]
name = "yoram-migration"
edition.workspace = true
license.workspace = true
version.workspace = true
autotests = false

[features]
default = ["sqlite"]
sqlite = [
    "sea-orm/sqlx-sqlite",
    "sea-orm-migration/sqlx-sqlite",
]
postgres = [
    "sea-orm/sqlx-postgres",
    "sea-orm-migration/sqlx-postgres",
]
mysql = [
    "sea-orm/sqlx-mysql",
    "sea-orm-migration/sqlx-mysql",
]
db-matrix = ["sqlite", "postgres", "mysql"]

[dependencies]
base64.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
yoram-persistence-entities = { path = "../persistence-entities" }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "migration"
path = "tests/main.rs"
