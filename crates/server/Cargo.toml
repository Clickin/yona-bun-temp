[package]
name = "yoram-server"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"
autotests = false

[[bin]]
name = "yoram"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = [
    "sea-orm/sqlx-sqlite",
    "yoram-persistence/sqlite",
    "yoram-migration/sqlite",
    "dep:sqlx",
    "sqlx/sqlite",
]
postgres = [
    "sea-orm/sqlx-postgres",
    "yoram-persistence/postgres",
    "yoram-migration/postgres",
]
mysql = [
    "sea-orm/sqlx-mysql",
    "yoram-persistence/mysql",
    "yoram-migration/mysql",
]
db-matrix = ["sqlite", "postgres", "mysql"]

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
bcrypt.workspace = true
bytes.workspace = true
chardetng.workspace = true
encoding_rs.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
include_dir.workspace = true
ldap3.workspace = true
md-5.workspace = true
mime_guess.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
sqlx = { version = "0.8", default-features = false, optional = true }
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sea-orm.workspace = true
toml = "0.8"
yoram-domain = { path = "../domain" }
yoram-integrations = { path = "../integrations" }
yoram-persistence = { path = "../persistence" }
yoram-migration = { path = "../migration" }
yoram-search = { path = "../search" }
yoram-vcs = { path = "../vcs" }

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true
testcontainers-modules = { version = "0.15", features = ["postgres", "mariadb"] }

[[test]]
name = "project_storage_lifecycle_contract"
path = "tests/project_storage_lifecycle_contract.rs"

