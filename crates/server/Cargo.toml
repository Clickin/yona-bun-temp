[package]
name = "yona-rust-pilot-server"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"
autotests = false

[features]
default = ["sqlite"]
sqlite = [
    "sea-orm/sqlx-sqlite",
    "yona-rust-persistence/sqlite",
    "yona-rust-pilot-migration/sqlite",
]
postgres = [
    "sea-orm/sqlx-postgres",
    "yona-rust-persistence/postgres",
    "yona-rust-pilot-migration/postgres",
]
mysql = [
    "sea-orm/sqlx-mysql",
    "yona-rust-persistence/mysql",
    "yona-rust-pilot-migration/mysql",
]
db-matrix = ["sqlite", "postgres", "mysql"]

[dependencies]
anyhow.workspace = true
ammonia.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
bcrypt.workspace = true
buffa.workspace = true
buffa-types.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
include_dir.workspace = true
ldap3.workspace = true
md-5.workspace = true
mime_guess.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sea-orm.workspace = true
toml = "0.8"
yona-rust-domain = { path = "../domain" }
yona-rust-integrations = { path = "../integrations" }
yona-rust-persistence = { path = "../persistence" }
yona-rust-pilot-migration = { path = "../migration" }
yona-rust-pilot-protocol = { path = "../protocol" }
yona-rust-search = { path = "../search" }
yona-rust-vcs = { path = "../vcs" }

[dev-dependencies]
tempfile.workspace = true
testcontainers-modules = { version = "0.15", features = ["postgres", "mariadb"] }

[[test]]
name = "server_core_contract"
path = "tests/server_core_contract.rs"

