[workspace]
members = [
    "crates/server",
    "crates/migration",
    "crates/domain",
    "crates/persistence",
    "crates/persistence-entities",
    "crates/vcs",
    "crates/search",
    "crates/integrations",
    "crates/yona-migrate",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bcrypt = "0.16"
bytes = "1.10"
chardetng = "0.1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
futures = "0.3"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
include_dir = "0.7"
ldap3 = { version = "0.11", default-features = false, features = ["tls-rustls"] }
lettre = "0.11"
md-5 = "0.10"
mime_guess = "2.0"
moka = { version = "0.12", features = ["future"] }
rand = "0.8"
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-chrono"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "with-chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
unicode-normalization = "0.1.25"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.dev]
codegen-units = 256
debug = 0
incremental = true

[profile.test]
codegen-units = 256
debug = 0
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
