[workspace]
members = [
    "crates/server",
    "crates/migration",
    "crates/domain",
    "crates/persistence",
    "crates/vcs",
    "crates/search",
    "crates/integrations",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
ammonia = "4.1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bcrypt = "0.16"
buffa = { version = "0.2", features = ["json"] }
buffa-codegen = "0.2"
buffa-types = { version = "0.2", features = ["json"] }
bytes = "1.10"
futures = "0.3"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
include_dir = "0.7"
lettre = "0.11"
md-5 = "0.10"
mime_guess = "2.0"
protoc-bin-vendored = "3.2"
pulldown-cmark = "0.13"
rand = "0.8"
sea-orm = { version = "1.1", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-chrono"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = true
